# Configuration only. No deployment is performed by creating this file.
services:
  - type: web
    name: skedtool
    runtime: docker
    repo: https://github.com/yuheiyta/SKEDTool
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: FLET_FORCE_WEB_SERVER
        value: "true"
      - key: FLET_SESSION_TIMEOUT
        value: "600"
